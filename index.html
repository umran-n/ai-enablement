<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Enablement</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #667085;
      --paper: #fbfaf8;
      --line: #ded8cf;
      --accent: #256f67;
      --accent-2: #8a4d2f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      width: min(1060px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: 32px;
      padding: 52px 0;
    }

    header {
      display: grid;
      gap: 12px;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 8vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.6;
    }

    .pages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    a {
      min-height: 220px;
      display: grid;
      align-content: space-between;
      gap: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: #fffefa;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 18px 44px rgba(17, 24, 39, 0.08);
      outline: none;
    }

    .label {
      color: var(--accent-2);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 12px 0 0;
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .open {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 28px, 1060px);
        align-content: start;
      }

      .pages {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Enablement</h1>
      <p>Two public-facing pages for the AI enablement program and the Rizvi agent showcase.</p>
    </header>

    <section class="pages" aria-label="Published pages">
      <a href="ai_enablement_onepager.html">
        <span>
          <span class="label">Program</span>
          <h2>AI Enablement Program</h2>
        </span>
        <span class="open">Open page</span>
      </a>

      <a href="rizvi_agent_showcase.html">
        <span>
          <span class="label">Showcase</span>
          <h2>Rizvi AI Takeover</h2>
        </span>
        <span class="open">Open page</span>
      </a>
    </section>
  </main>
</body>
</html>
